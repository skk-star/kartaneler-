<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kraliçe Anne'nin Danteli - Fraktal Simülatörü</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; font-size: 16px; min-height: 100vh; padding: 10px; }
        .container { max-width: 1400px; width: 100%; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(1.5px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .controls { display: flex; flex-direction: column; gap: 20px; }
        h1 { font-size: 1.5em; background: linear-gradient(135deg, #a400ff, #fff, #ff0077); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .subtitle { font-size: 0.85em; color: #aaa; margin-bottom: 15px; }
        .control-group { background: rgba(255, 255, 255, 0.08); padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .control-group label { display: block; font-size: 0.9em; margin-bottom: 10px; color: #00bcd4; font-weight: 600; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        input[type="range"] { flex: 1; height: 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.1); outline: none; -webkit-appearance: none; touch-action: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #0ae2fa, #4bdb11, rgb(41, 24, 5)); cursor: pointer; box-shadow: 0 5px 8px rgba(116, 47, 15, 0.212); }
        .value-display { min-width: 45px; text-align: center; font-weight: bold; font-size: 1em; color: #378f21; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button { padding: 14px 20px; background: linear-gradient(35deg, #ff66ff, #00ffff); color: #1a1a2e; border: solid 1px #00ffff; border-radius: 12px; font-size: 0.95em; font-weight: 600; cursor: pointer; transition: all 0.3s ease; touch-action: manipulation; }
        button:hover { transform: scale(1.05); border-radius: 20px; }
        .canvas-container { background: #000; border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: center; min-height: 400px; box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5); position: relative; }
        canvas { max-width: 100%; height: auto; border-radius: 10px; display: block; }
        .stats-section, .comments-section { max-width: 1400px; width: 100%; margin: 20px auto 0 auto; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(1px); border-radius: 20px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); border-left: 3px solid #ff00cc; }
        .stats-section h2, .comments-section h2 { font-size: 1.3em; margin-bottom: 15px; color: #ff00cc; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .stat-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #00ffff; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffd700; font-size: 1.2em; display: none; }
        .loading.active { display: block; }
        /* FastComments için yer tutucuyu gizlemiyoruz, varsayılan görünüm iyidir. */
        #fastcomments-widget { min-height: 300px; } 

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h1>✨ Kraliçe Anne'nin Danteli</h1>
            <div class="subtitle">Fraktal Geometri Simülatörü (Harici Yorum Sistemi)</div>
            
            <div class="control-group"><label>Tekrar Sayısı</label><div class="slider-container"><input type="range" id="repetitions" min="4" max="16" value="8" step="1"><span class="value-display" id="repetitionsValue">8</span></div></div>
            <div class="control-group"><label>Derinlik (Katman)</label><div class="slider-container"><input type="range" id="depth" min="1" max="8" value="5" step="1"><span class="value-display" id="depthValue">5</span></div></div>
            <div class="control-group"><label>Dal Uzunluğu</label><div class="slider-container"><input type="range" id="length" min="20" max="80" value="50" step="5"><span class="value-display" id="lengthValue">50</span></div></div>
            <div class="control-group"><label>Dallanma Açısı</label><div class="slider-container"><input type="range" id="angle" min="15" max="75" value="45" step="5"><span class="value-display" id="angleValue">45°</span></div></div>
            <div class="control-group"><label>Animasyon Hızı</label><div class="slider-container"><input type="range" id="speed" min="0" max="20" value="2" step="1"><span class="value-display" id="speedValue">2ms</span></div></div>

            <div class="button-group">
                <button onclick="drawFractal()">🎨 Çiz</button>
                <button onclick="clearCanvas()">🗑️ Temizle</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="loading" id="loading">⏳ Çiziliyor...</div>
            <canvas id="canvas" width="700" height="700"></canvas>
        </div>
    </div>

    <div class="stats-section">
        <h2>📊 Fraktal İstatistikleri</h2>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon">🌿</div><div class="stat-label">Toplam Dal</div><div class="stat-value" id="totalBranches">0</div></div>
            <div class="stat-card"><div class="stat-icon">📏</div><div class="stat-label">Çizgi Sayısı</div><div class="stat-value" id="totalLines">0</div></div>
            <div class="stat-card"><div class="stat-icon">⏱️</div><div class="stat-label">Süre</div><div class="stat-value" id="drawTime">0s</div></div>
            <div class="stat-card"><div class="stat-icon">🎨</div><div class="stat-label">Geometri</div><div class="stat-value" id="geometry">8-gen</div></div>
        </div>
    </div>

    <div class="comments-section">
        <h2>💬 Yorumlar (FastComments)</h2>
        <div id="fastcomments-widget"></div>
    </div>

    <script src="https://js.fastcomments.com/js/embed-v2.min.js"></script> 
    <script>
        // FastComments Entegrasyonu
        window.FastCommentsUI(document.getElementById('fastcomments-widget'), {
            // !!! BU ID'Yİ KENDİ TENANT ID'NİZLE DEĞİŞTİREBİLİRSİNİZ !!!
            tenantId: 'demo-tenant', 
            // URL ID'si, bu sayfadaki yorumları diğer sayfalardan ayırır.
            urlId: 'kralice-anne-dantel-v2',
            title: 'Kraliçe Anne\'nin Danteli - Fraktal Yorumları'
        });
    </script>
    
    <script>
        // --- Fraktal Çizim Kodu ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = Math.min(container.clientWidth - 30, container.clientHeight - 30, 700);
            canvas.width = size;
            canvas.height = size;
        }
        
        resizeCanvas();
        window.addEventListener('resize', () => { if (!isDrawing) { resizeCanvas(); drawFractal(); } });

        const centerX = () => canvas.width / 2;
        const centerY = () => canvas.height / 2;

        let drawingQueue = [];
        let isDrawing = false;
        let drawStartTime = 0;
        let lineCount = 0;
        let animationFrame = null;
        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];

        document.querySelectorAll('input[type="range"]').forEach(input => {
            input.addEventListener('input', (e) => {
                const displayId = e.target.id + 'Value';
                const unit = (e.target.id === 'angle' ? '°' : e.target.id === 'speed' ? (e.target.value === '0' ? 'Hızlı' : 'ms') : '');
                document.getElementById(displayId).textContent = e.target.value + unit;
            });
        });

        function drawSinglePattern(x, y, angle, length, depth, branchAngle, color) {
            if (depth === 0) return;
            const endX = x + length * Math.cos(angle);
            const endY = y + length * Math.sin(angle);
            drawingQueue.push({ type: 'line', x1: x, y1: y, x2: endX, y2: endY, color: color });
            lineCount++;

            const newLength = length * 0.65;
            drawSinglePattern(endX, endY, angle + branchAngle, newLength, depth - 1, branchAngle, color);
            drawSinglePattern(endX, endY, angle - branchAngle, newLength, depth - 1, branchAngle, color);
            if (depth > 1) {
                drawSinglePattern(endX, endY, angle, newLength * 0.8, depth - 1, branchAngle, color);
            }
        }

        function animateDraw() {
            if (drawingQueue.length === 0) {
                isDrawing = false;
                loading.classList.remove('active');
                updateStats();
                return;
            }

            isDrawing = true;
            const speed = parseInt(document.getElementById('speed').value);
            
            if (speed === 0) { 
                while (drawingQueue.length > 0) {
                    const item = drawingQueue.shift();
                    if (item.type === 'line') {
                        ctx.beginPath(); 
                        ctx.strokeStyle = item.color;
                        ctx.lineWidth = 1.5;
                        ctx.moveTo(item.x1, item.y1);
                        ctx.lineTo(item.x2, item.y2);
                        ctx.stroke();
                    }
                }
                animateDraw();
            } else {
                const batchSize = Math.max(1, Math.floor(50 / speed)); 
                for (let i = 0; i < batchSize && drawingQueue.length > 0; i++) {
                    const item = drawingQueue.shift();
                    if (item.type === 'line') {
                        ctx.beginPath();
                        ctx.moveTo(item.x1, item.y1);
                        ctx.lineTo(item.x2, item.y2);
                        ctx.strokeStyle = item.color;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                    }
                }
                animationFrame = requestAnimationFrame(animateDraw);
            }
        }

        function updateStats() {
            const repetitions = parseInt(document.getElementById('repetitions').value);
            const depth = parseInt(document.getElementById('depth').value);
            const drawTime = ((Date.now() - drawStartTime) / 1000).toFixed(2);
            
            const totalBranches = repetitions * (Math.pow(2, depth+1) - 1); 
            const geometry = repetitions === 8 ? '8-gen' : repetitions + '-gen';
            
            document.getElementById('totalBranches').textContent = Math.round(totalBranches);
            document.getElementById('totalLines').textContent = lineCount;
            document.getElementById('drawTime').textContent = drawTime + 's';
            document.getElementById('geometry').textContent = geometry;
        }

        function drawFractal() {
            if (isDrawing) { if (animationFrame) cancelAnimationFrame(animationFrame); }
            
            loading.classList.add('active');
            clearCanvas();
            drawingQueue = [];
            lineCount = 0;
            drawStartTime = Date.now();

            const repetitions = parseInt(document.getElementById('repetitions').value);
            const depth = parseInt(document.getElementById('depth').value);
            const length = parseInt(document.getElementById('length').value);
            const branchAngle = parseInt(document.getElementById('angle').value) * Math.PI / 180;
            const rotationAngle = (2 * Math.PI) / repetitions;

            for (let i = 0; i < repetitions; i++) {
                const angle = i * rotationAngle;
                const color = colors[i % colors.length];
                drawSinglePattern(centerX(), centerY(), angle - Math.PI / 2, length, depth, branchAngle, color);
            }
            setTimeout(() => animateDraw(), 10);
        }

        function clearCanvas() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Sayfa yüklendiğinde
        clearCanvas();
        drawFractal(); 
    </script>
</body>
</html>
